services:
  # MinIO: 100% S3-Compatible Cloud Object Storage
  minio:
    image: minio/minio:latest
    container_name: cloudguard-s3-store
    ports:
      - "9000:9000"       # S3 API endpoint
      - "9001:9001"       # MinIO Web Console
    environment:
      MINIO_ROOT_USER: cloudguard_admin
      MINIO_ROOT_PASSWORD: cloudguard_secret_key
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Bucket Auto-Provisioner: Automatically creates the 3 isolated storage tiers
  create-buckets:
    image: minio/mc:latest
    container_name: cloudguard-s3-provisioner
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 cloudguard_admin cloudguard_secret_key;
      /usr/bin/mc mb --ignore-existing myminio/cloudguard-incoming;
      /usr/bin/mc mb --ignore-existing myminio/cloudguard-processed;
      /usr/bin/mc mb --ignore-existing myminio/cloudguard-quarantine;
      /usr/bin/mc anonymous set none myminio/cloudguard-incoming;
      /usr/bin/mc anonymous set none myminio/cloudguard-processed;
      /usr/bin/mc anonymous set none myminio/cloudguard-quarantine;
      echo 'CloudGuard S3 Buckets Provisioned & Sealed Private!';
      exit 0;
      "

  # CloudGuard Application Service
  cloudguard-app:
    build: .
    container_name: cloudguard-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - STORAGE_PROVIDER=s3
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=cloudguard_admin
      - AWS_SECRET_ACCESS_KEY=cloudguard_secret_key
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_FORCE_PATH_STYLE=true
      - S3_BUCKET_INCOMING=cloudguard-incoming
      - S3_BUCKET_PROCESSED=cloudguard-processed
      - S3_BUCKET_QUARANTINE=cloudguard-quarantine
    depends_on:
      - minio

volumes:
  minio_data:
